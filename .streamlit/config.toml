[browser]
gatherUsageStats = false

[server]
headless = true
maxUploadSize = 10
maxMessageSize = 50

# Business-consulting visual identity: ivory canvas, charcoal ink,
# serif headings, and a deep navy accent inspired by strategy-firm reports.
[theme]
base = "light"
primaryColor = "#1F3A5F"
backgroundColor = "#FAF9F5"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#1F2933"
linkColor = "#1F3A5F"
borderColor = "#D8D3C8"
dataframeBorderColor = "#D8D3C8"
dataframeHeaderBackgroundColor = "#EFECE3"
font = "sans-serif"
headingFont = "serif"
headingFontWeights = [600, 600, 600, 600, 600, 600]
baseRadius = "0.25rem"
buttonRadius = "0.25rem"
showWidgetBorder = true
showSidebarBorder = true
chartCategoricalColors = [
  "#1F3A5F",
  "#B08D57",
  "#5B7C99",
  "#8A9A5B",
  "#7A6C5D",
  "#A63D40",
]

[theme.sidebar]
backgroundColor = "#152A45"
secondaryBackgroundColor = "#1F3A5F"
textColor = "#E8ECF2"
primaryColor = "#B08D57"
linkColor = "#D9C7A7"
borderColor = "#2C4A70"
dataframeBorderColor = "#2C4A70"
dataframeHeaderBackgroundColor = "#1F3A5F"
