# Deterministic fault-injection fixtures for the Google Ads connector.
# Scenario names must stay in sync with config/google_ads.yaml
# mock.fault_injection.scenarios. Synthetic data only.
scenarios:
  HTTP_429:
    note: "RESOURCE_EXHAUSTED / quota exceeded; honor Retry-After, queue with jitter"
    retry_after_seconds: 23
  AUTH_EXPIRED:
    message: "provider rejected the request: access token expired or revoked"
  DEVELOPER_TOKEN_INVALID:
    note: "Developer Token rejected; non-retryable, requires human rotation via runbook"
  TIMEOUT_AFTER_EXTERNAL_CREATE:
    note: "mutate landed, then the response is lost; outcome UNKNOWN, reconcile before retry"
  DUPLICATE_DELIVERY:
    note: "provider already holds the object for this idempotency key; no second object is created"
  PARTIAL_MUTATE_SUCCESS:
    note: "campaign mutate partially applied; stop further writes and record created IDs"
  PAGE_INTERRUPT:
    note: "SearchStream/Search pagination breaks mid-stream; resume from last page_token, no duplicate rows"
