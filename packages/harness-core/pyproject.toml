[project]
name = "harness-core"
version = "0.1.0"
description = "Shared dual-agent harness: loop, tool registry, permissions, hooks, context, memory, goal check (Phase 01; fakes only)"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
  "pydantic==2.13.4",
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "mypy==2.3.1",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.mypy]
mypy_path = "src"
packages = ["harness_core"]
strict = true
