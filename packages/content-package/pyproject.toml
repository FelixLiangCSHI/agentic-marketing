[project]
name = "dmt-content-package"
version = "0.1.0"
description = "Immutable ApprovedContentPackage builder (Phase 02 / Subphase 07). Only legal approvals, complete citations, valid assets and a stable canonical hash can create an APPROVED package."
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
  "pydantic==2.13.4",
]

# 本包还依赖同仓库的 product-rag、content-workflow 与 compliance（本地路径安装）：
#   python3 -m pip install -e "packages/product-rag" -e "packages/content-workflow" -e "packages/compliance" -e "packages/content-package[dev]"

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "mypy==2.3.1",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
content_package = ["py.typed"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.mypy]
mypy_path = "src:tests"
packages = ["content_package"]
strict = true
