# The existing filename is retained for the registered workflow.
name: verify-pardot-production

on:
  workflow_dispatch:
    inputs:
      approval_reference:
        description: "Approved read-only production verification change ticket"
        type: string
        required: true
      confirm_production_read_only:
        description: "Confirm Salesforce OAuth and read-only Campaign Query; no email sends"
        type: boolean
        default: false
        required: true

permissions:
  contents: read

concurrency:
  group: pardot-production-verification
  cancel-in-progress: false

jobs:
  verify:
    if: >-
      github.repository == 'FelixLiangCSHI/agentic-marketing' &&
      github.event.repository.fork == false &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      github.ref_protected == true
    environment: production
    runs-on: [self-hosted, linux, x64, pardot-production-verification]
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      AGENTIC_MARKETING_PARDOT_MODE: api
      PARDOT_VERIFICATION_ENVIRONMENT: production
      PARDOT_APPROVED_COMMIT_SHA: ${{ vars.PARDOT_APPROVED_COMMIT_SHA }}
      PARDOT_APPROVAL_REFERENCE: ${{ vars.PARDOT_APPROVAL_REFERENCE }}
      PARDOT_CREDENTIALS_SECRET_REF: ${{ vars.PARDOT_CREDENTIALS_SECRET_REF }}
      PARDOT_REQUESTED_APPROVAL_REFERENCE: ${{ inputs.approval_reference }}
      PARDOT_READ_ONLY_CONFIRMED: ${{ inputs.confirm_production_read_only }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Guard approved source and read-only confirmation
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_SHA" != "$PARDOT_APPROVED_COMMIT_SHA" ] ||
             [ -z "$PARDOT_APPROVAL_REFERENCE" ] ||
             [ "$PARDOT_APPROVAL_REFERENCE" != "$PARDOT_REQUESTED_APPROVAL_REFERENCE" ] ||
             [ "$PARDOT_READ_ONLY_CONFIRMED" != "true" ]; then
            echo "::error::Approved commit, change ticket and explicit read-only confirmation are required."
            exit 1
          fi
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Verify Salesforce OAuth and production Campaign Query
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run pardot:verify:production
