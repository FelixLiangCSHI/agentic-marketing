# 普通 PR CI：只运行无 Secret 的 Unit/Contract/Mock 测试。
# 不访问 DEV/SIT/UAT/PRD，不调用真实外部写 API；所有能力保持 mode: mock。
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      # 一次性 postgres:16 容器，仅供 CI 集成测试；非真实环境或真实 Credential。
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: dmt_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DMT_TEST_DATABASE_URL: postgresql+psycopg://postgres@localhost:5432/dmt_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest
      - run: python -m mypy

  harness:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/harness-core
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest
      - run: python -m mypy

  infra:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/infra-core
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest
      - run: python -m mypy

  # Phase 02 / Subphase 01：批准 Product 只读 Adapter（仅合成 fixtures，无真实 Product API）。
  product-rag:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/product-rag
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest
      - run: python -m mypy

  # Phase 02 / Subphase 03：Skill Registry + LangGraph Content Workflow（Fake Model/Media/Reviewer）。
  content-workflow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e "packages/product-rag" -e "packages/harness-core" -e "packages/content-workflow[dev]"
      - run: python -m pytest
        working-directory: packages/content-workflow
      - run: python -m mypy
        working-directory: packages/content-workflow

  # Phase 02 / Subphase 04：DeepSeek Connector（确定性 Mock、错误标准化、限流与费用门禁；无外部 HTTP）。
  deepseek-connector:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e "packages/product-rag" -e "packages/harness-core" -e "packages/infra-core" -e "packages/content-workflow" -e "connectors/llm/deepseek[dev]"
      - run: python -m pytest
        working-directory: connectors/llm/deepseek
      - run: python -m mypy
        working-directory: connectors/llm/deepseek
      - run: python -m mypy tests
        working-directory: connectors/llm/deepseek

  # Phase 02 / Subphase 05：即梦官方企业媒体 Connector（异步 Job、持久队列轮询、对象存储导入；确定性 Mock，无外部 HTTP）。
  jimeng-connector:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e "packages/product-rag" -e "packages/harness-core" -e "packages/infra-core" -e "packages/content-workflow" -e "connectors/jimeng[dev]"
      - run: python -m pytest
        working-directory: connectors/jimeng
      - run: python -m mypy
        working-directory: connectors/jimeng
      - run: python -m mypy tests scripts
        working-directory: connectors/jimeng

  # Phase 02 / Subphase 06：确定性合规规则 + Critic + 评测门（规则失败不可被模型覆盖）。
  compliance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e "packages/product-rag" -e "packages/harness-core" -e "packages/infra-core" -e "packages/content-workflow" -e "packages/compliance[dev]"
      - run: python -m pytest
        working-directory: packages/compliance
      - run: python -m mypy
        working-directory: packages/compliance
      - run: python -m mypy tests
        working-directory: packages/compliance

  # Phase 02 / Subphase 07：不可变 ApprovedContentPackage Builder（只有合法审批、完整引用、有效资产和稳定 hash 才能创建）。
  content-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e "packages/product-rag" -e "packages/harness-core" -e "packages/infra-core" -e "packages/content-workflow" -e "packages/compliance" -e "packages/content-package[dev]"
      - run: python -m pytest
        working-directory: packages/content-package
      - run: python -m mypy
        working-directory: packages/content-package
      - run: python -m mypy tests
        working-directory: packages/content-package

  # Phase 03 / Subphase 01：确定性 CampaignProposal Draft Builder（只消费 APPROVED、未过期、hash 匹配且含渠道变体的内容包）。
  campaign-draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e "packages/product-rag" -e "packages/harness-core" -e "packages/infra-core" -e "packages/content-workflow" -e "packages/compliance" -e "packages/content-package" -e "packages/campaign-draft[dev]"
      - run: python -m pytest
        working-directory: packages/campaign-draft
      - run: python -m mypy
        working-directory: packages/campaign-draft
      - run: python -m mypy tests
        working-directory: packages/campaign-draft

  # 双语言契约门禁：TypeScript 与 Python 对同一批 golden/invalid fixture 结论必须一致。
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: npm ci
      - run: npx tsx --test src/tests/domain-contracts.test.ts src/tests/domain-contracts-adapter.test.ts
      - run: python -m pip install -e "apps/api[dev]"
      - run: python -m pytest tests/test_contract_fixtures.py
        working-directory: apps/api

  # Migration 往返门禁：base -> head -> base，逐版本 downgrade 后无残留表。
  migration:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: dmt_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DMT_TEST_DATABASE_URL: postgresql+psycopg://postgres@localhost:5432/dmt_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest tests/db

  # 安全门禁：Secret 扫描 + 依赖漏洞扫描。镜像扫描待企业批准方案（见 docs/phase01/blocked.md）。
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python3 scripts/check_no_secrets.py
      - run: npm audit --audit-level=high
      - run: |
          python -m pip install -e "apps/api[dev]" -e "packages/harness-core[dev]" -e "packages/infra-core[dev]" -e "packages/product-rag[dev]" -e "packages/content-workflow[dev]" -e "packages/compliance[dev]" -e "packages/content-package[dev]" -e "connectors/llm/deepseek[dev]" -e "connectors/jimeng[dev]"
          python -m pip install pip-audit
          python -m pip_audit --skip-editable
      # 无回归例外：eslint 已在 web job 执行；此处仅安全扫描。

  # 最小 Content/Campaign Eval：golden + adversarial（无审批 L3 / L4 / 跨 Agent 必须拒绝）。
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e "packages/harness-core[dev]"
      - run: python -m pytest evals

  # Phase 01 集成质量门：Fake 双 Agent 生命周期 + 故障注入（harness-core × infra-core）。
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e "packages/harness-core[dev]" -e "packages/infra-core[dev]"
      - run: python -m pytest integration
