# 预留的外部 Knowledge Base 配置模板（Phase 02 / Subphase 02）。
# 当前仅本地 InMemory 索引可用；MIDEA Knowledge Base 为预留接口，
# 正式接入前保持 enabled: false / mode: mock。
# Secret 只允许 Secret Reference（env 名），禁止写入任何真实值。
schema_version: "1.0"
provider: "midea_kb"
enabled: false
mode: "mock" # mock | sandbox | live

endpoint_env: "MIDEA_KB_ENDPOINT"
api_key_secret_ref_env: "MIDEA_KB_API_KEY_SECRET_REF"
collection_env: "MIDEA_KB_COLLECTION"
allowed_fqdns_env: "MIDEA_KB_ALLOWED_FQDNS"
tls_verify: true
