# Alembic configuration for the Control API persistence layer.
# The database URL is never stored here: it is injected via the
# DMT_TEST_DATABASE_URL environment variable (local/CI) or the protected
# deployment pipeline (remote environments). Only secret references are
# allowed in configuration.

[alembic]
script_location = migrations
path_separator = os
prepend_sys_path = src
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
